<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Profile - ProjectPal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{ink:'#102A43',ocean:'#0F766E'}}}}</script>
  <link rel="stylesheet" href="projectpal.css">
  <style>body{background:#F5F7FA;color:#334155}</style>
</head>
<body class="min-h-screen">
  <header class="bg-white border-b border-slate-200">
    <div class="mx-auto flex max-w-[90rem] items-center justify-between px-5 py-4 sm:px-8">
      <a href="welcome-hub.html" class="flex items-center gap-2 text-lg font-extrabold text-ink"><span class="grid h-10 w-10 place-items-center rounded-xl bg-ocean text-white">P</span>ProjectPal</a>
      <a href="dashboard.html" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-bold text-ink hover:bg-slate-50">&larr; Back to Dashboard</a>
    </div>
  </header>
  <main class="mx-auto max-w-4xl px-5 py-16 text-center sm:px-8">
    <p class="text-sm font-bold uppercase tracking-wider text-ocean">Profile</p>
    <h1 class="mt-2 text-3xl font-extrabold text-ink sm:text-4xl">Your profile</h1>
    <p class="mt-3 text-slate-600">Your saved details.</p>
    
  </main>
  <script src="projectpal.js"></script>
  <section id="profileView" class="mx-auto mt-10 max-w-3xl rounded-2xl border border-slate-200 bg-white p-6 text-left"></section>
  <script>
  (function(){var p=ProjectPal.getProfile(),box=document.getElementById('profileView'),skip={avatar:1,id:1};
  var keys=Object.keys(p).filter(function(k){return !skip[k]&&p[k]&&(!Array.isArray(p[k])||p[k].length)});
  if(!keys.length){box.innerHTML='<p class="text-slate-600">No profile details saved yet.</p>'}else{
   box.innerHTML=(p.avatar?'<img alt="Profile picture" class="mb-5 h-24 w-24 rounded-2xl object-cover" id="pav">':'')+'<dl class="grid gap-4 sm:grid-cols-2" id="pl"></dl>';
   if(p.avatar)document.getElementById('pav').src=p.avatar;
   keys.forEach(function(k){var d=document.createElement('div');d.innerHTML='<dt class="text-xs font-bold uppercase text-slate-400"></dt><dd class="mt-1 break-words text-slate-700"></dd>';
    d.firstChild.textContent=k.replace(/([A-Z])/g,' $1').replace(/^./,function(c){return c.toUpperCase()});d.lastChild.textContent=Array.isArray(p[k])?p[k].join(', '):p[k];document.getElementById('pl').appendChild(d)})}
  box.insertAdjacentHTML('beforeend','<a href="edit-profile.html" class="mt-6 inline-block rounded-xl bg-ocean px-5 py-2.5 font-bold text-white hover:bg-teal-800">Edit profile</a>')})();
  </script>
</body>
</html>
