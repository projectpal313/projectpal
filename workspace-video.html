<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Academic Workspace Video — ProjectPal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="projectpal.css">
  <script>tailwind.config={theme:{extend:{colors:{ink:'#102A43',ocean:'#0F766E'}}}}</script>
  <style>
    body { background: #F5F7FA; color: #334155; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem; box-shadow: 0 20px 60px rgba(16,42,67,.15); }
    .video-container video, .video-container img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 1rem; }
    .video-container .fallback { cursor: pointer; transition: opacity .3s; }
    .video-container .fallback:hover { opacity: .85; }
    .video-container video { display: none; }
    .video-container.playing video { display: block; }
    .video-container.playing .fallback { display: none; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp .4s ease-out; }
  </style>
</head>
<body class="min-h-screen">
  <header class="bg-white border-b border-slate-200">
    <div class="mx-auto flex max-w-[90rem] items-center justify-between px-5 py-4 sm:px-8">
      <a href="welcome-hub.html" class="flex items-center gap-2 text-lg font-extrabold text-ink"><span class="grid h-10 w-10 place-items-center rounded-xl bg-ocean text-white">P</span>ProjectPal</a>
      <a href="workspace.html" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-bold text-ink hover:bg-slate-50">&larr; Back to Workspace</a>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-5 py-10 sm:px-8">
    <div class="mb-8 fade-up">
      <p class="text-sm font-bold uppercase tracking-wider text-ocean">Academic Workspace</p>
      <h1 class="mt-2 text-3xl font-extrabold text-ink sm:text-4xl">See the workspace in action</h1>
      <p class="mt-2 text-slate-600">Watch the walkthrough, then open the interactive workspace to start your project.</p>
    </div>

    <div class="video-container fade-up" id="videoContainer" onclick="this.classList.add('playing')">
      <video id="workspaceVideo" preload="metadata" poster="assets/hero-fallback.jpg">
        <source src="assets/academic-workspace.mp4" type="video/mp4">
      </video>
      <img class="fallback" src="assets/hero-fallback.jpg" alt="Academic workspace preview — click to play" width="1280" height="720">
      <div class="absolute inset-0 flex items-center justify-center" style="pointer-events:none;">
        <div class="grid h-20 w-20 place-items-center rounded-full bg-ocean/80 text-white text-3xl shadow-lg transition hover:scale-110" id="playOverlay">▶</div>
      </div>
    </div>

    <div class="mt-8 flex flex-wrap gap-3 fade-up">
      <a href="workspace.html" class="rounded-xl bg-ocean px-6 py-3 font-bold text-white hover:bg-teal-800">Open Interactive Workspace</a>
      <a href="dashboard.html" class="rounded-xl border border-slate-300 px-6 py-3 font-bold text-ink hover:bg-slate-50">Back to Dashboard</a>
    </div>
  </main>

  <script src="projectpal.js"></script>
  <script>
    var video = document.getElementById('workspaceVideo');
    var container = document.getElementById('videoContainer');
    var overlay = document.getElementById('playOverlay');

    overlay.addEventListener('click', function (e) {
      e.stopPropagation();
      container.classList.add('playing');
      video.play().catch(function () {});
    });

    video.addEventListener('ended', function () {
      overlay.textContent = '▶';
      overlay.style.display = '';
    });

    video.addEventListener('play', function () {
      overlay.style.display = 'none';
    });
  </script>
</body>
</html>
