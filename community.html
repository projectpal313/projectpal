<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Community - ProjectPal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{ink:'#102A43',ocean:'#0F766E'}}}}</script>
  <link rel="stylesheet" href="projectpal.css">
  <style>body{background:#F5F7FA;color:#334155}</style>
</head>
<body data-sidebar class="min-h-screen lg:pr-60">
<header class="bg-white border-b border-slate-200"><div class="mx-auto flex max-w-5xl items-center justify-between px-5 py-4"><a href="welcome-hub.html" class="flex items-center gap-2 text-lg font-extrabold text-ink"><span class="grid h-10 w-10 place-items-center rounded-xl bg-ocean text-white">P</span>ProjectPal</a><a href="home.html" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-bold text-ink hover:bg-slate-50">&larr; Home</a></div></header>
<main class="mx-auto max-w-5xl px-5 py-10"><p class="text-sm font-bold uppercase tracking-wider text-ocean">Community</p>
<h1 class="mt-2 text-3xl font-extrabold text-ink sm:text-4xl">Learn with students like you</h1>
<p class="mt-3 max-w-2xl text-slate-600">Ask questions, share progress and find teammates. Live discussions are coming soon. These are examples of what you will see.</p>
<div class="mt-8 space-y-3" id="posts"></div>
<script>
var posts=[['How do I choose between a survey and interviews?','Research Methods',12],['Anyone building with Flutter and Firebase?','Software',8],['Tips for defending with a nervous panel','Defense',21]];
document.getElementById('posts').innerHTML=posts.map(function(p){return '<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-soft flex items-center justify-between gap-4"><div><p class="font-bold text-ink">'+p[0]+'</p><p class="mt-1 text-xs text-slate-500">'+p[1]+'</p></div><span class="rounded-full bg-teal-50 px-3 py-1 text-xs font-bold text-ocean">'+p[2]+' replies</span></div>'}).join('');
</script>
<a href="home.html#teammates" class="mt-8 inline-block rounded-xl bg-ocean px-6 py-3 font-bold text-white hover:bg-teal-800">Find teammates</a></main>
<script src="projectpal.js"></script>
</body>
</html>
