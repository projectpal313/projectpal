<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholar Tracker — ProjectPal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{ink:'#0F172A',ocean:'#1E3A8A'},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
</head>
<body class="bg-slate-50 font-sans text-slate-700 antialiased">
<main class="mx-auto max-w-4xl px-4 py-8">
  <a href="welcome-hub.html" class="text-sm font-bold text-ocean">← Back</a>
  <h1 class="mt-3 text-3xl font-extrabold text-ink">Scholar Tracker</h1>
  <p class="mt-1 text-slate-500">Your goals and milestones in one place.</p>
  <div class="mt-5 rounded-xl border border-slate-200 bg-white p-5">
    <div class="flex justify-between text-sm font-bold text-ink"><span>Overall progress</span><span id="pct">0%</span></div>
    <div class="mt-2 h-2 overflow-hidden rounded-full bg-slate-100"><div id="bar" class="h-full w-0 rounded-full bg-ocean transition-all"></div></div>
  </div>
  <div class="mt-6 grid gap-5 md:grid-cols-2">
    <section class="rounded-xl border border-slate-200 bg-white p-5">
      <h2 class="font-bold text-ink">Goals</h2>
      <form id="gf" class="mt-3 flex gap-2"><input id="gt" required maxlength="120" placeholder="Add a goal" class="min-w-0 flex-1 rounded-xl border border-slate-200 px-3 py-2 text-base"><button class="rounded-xl bg-ocean px-4 py-2 font-bold text-white">Add</button></form>
      <ul id="gl" class="mt-3 space-y-2"></ul>
    </section>
    <section class="rounded-xl border border-slate-200 bg-white p-5">
      <h2 class="font-bold text-ink">Milestones</h2>
      <form id="mf" class="mt-3 grid gap-2"><input id="mt" required maxlength="120" placeholder="Add a milestone" class="rounded-xl border border-slate-200 px-3 py-2 text-base"><div class="flex gap-2"><input id="md" type="date" class="min-w-0 flex-1 rounded-xl border border-slate-200 px-3 py-2 text-base"><button class="rounded-xl bg-ocean px-4 py-2 font-bold text-white">Add</button></div></form>
      <ul id="ml" class="mt-3 space-y-2"></ul>
    </section>
  </div>
</main>
<script>
var K = 'pp_tracker', D = { g: [], m: [] };
try { D = JSON.parse(localStorage.getItem(K)) || D; } catch (e) {}
function save() { try { localStorage.setItem(K, JSON.stringify(D)); } catch (e) {} draw(); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
function row(t, done, extra, i, kind) {
  return '<li class="flex items-center gap-3 rounded-xl bg-slate-50 p-3"><input type="checkbox" data-k="' + kind + '" data-i="' + i + '" class="h-5 w-5 accent-blue-900"' + (done ? ' checked' : '') + '><div class="min-w-0 flex-1"><p class="text-sm font-semibold text-ink' + (done ? ' line-through opacity-60' : '') + '">' + esc(t) + '</p>' + (extra ? '<p class="text-xs text-slate-500">' + esc(extra) + '</p>' : '') + '</div><button data-x="' + kind + '" data-i="' + i + '" class="text-xs font-bold text-red-600" aria-label="Delete">Delete</button></li>';
}
function draw() {
  document.getElementById('gl').innerHTML = D.g.map(function (x, i) { return row(x.t, x.d, '', i, 'g'); }).join('') || '<li class="text-sm text-slate-500">No goals yet.</li>';
  document.getElementById('ml').innerHTML = D.m.map(function (x, i) { return row(x.t, x.d, x.due ? 'Due ' + x.due : '', i, 'm'); }).join('') || '<li class="text-sm text-slate-500">No milestones yet.</li>';
  var all = D.g.concat(D.m), n = all.filter(function (x) { return x.d; }).length, p = all.length ? Math.round(n / all.length * 100) : 0;
  document.getElementById('pct').textContent = p + '%'; document.getElementById('bar').style.width = p + '%';
}
document.getElementById('gf').onsubmit = function (e) { e.preventDefault(); D.g.push({ t: gt.value.trim(), d: false }); gt.value = ''; save(); };
document.getElementById('mf').onsubmit = function (e) { e.preventDefault(); D.m.push({ t: mt.value.trim(), due: md.value, d: false }); mt.value = md.value = ''; save(); };
document.body.addEventListener('click', function (e) { var x = e.target.dataset.x; if (x) { D[x].splice(+e.target.dataset.i, 1); save(); } });
document.body.addEventListener('change', function (e) { var k = e.target.dataset.k; if (k) { D[k][+e.target.dataset.i].d = e.target.checked; save(); } });
draw();
</script>
</body>
</html>
