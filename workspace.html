<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Academic Workspace - ProjectPal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="projectpal.css">
<style>
:root{--bg:#F5F7FA;--panel:#fff;--raise:#F0FDFA;--line:#E2E8F0;--gold:#0F766E;--amber:#115E59;--text:#334155;--muted:#64748B;--bad:#DC2626;--ok:#0D9488;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.ws *:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:1.75rem 1.25rem 4rem}
.ws h1,.ws h2,.ws h3,.ws b{color:#102A43}.ws h1{font-size:1.7rem;font-weight:700}.sub{color:var(--muted);margin-top:.3rem}
.box{background:var(--panel);border:1px solid var(--line);border-radius:1rem}
details.brief{margin-top:1.2rem}details.brief summary{cursor:pointer;padding:.9rem 1.2rem;font-weight:600}
.bgrid{display:grid;gap:.8rem;padding:0 1.2rem 1.2rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.bgrid label{font-size:.8rem;font-weight:600;display:block}
.in{width:100%;margin-top:.3rem;background:#fff;border:1px solid var(--line);border-radius:.6rem;color:var(--text);padding:.55rem .75rem;font:inherit}
.in:focus{border-color:var(--gold);outline:none}
.tabs{display:flex;gap:.4rem;overflow-x:auto;margin-top:1.2rem}
.tab{background:none;border:1px solid var(--line);color:var(--muted);border-radius:.7rem;padding:.6rem 1rem;cursor:pointer;white-space:nowrap;font:inherit;font-size:.88rem}
.tab.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.tab small{margin-left:.4rem;opacity:.75}
.cols{display:grid;gap:1.2rem;margin-top:1.2rem;grid-template-columns:1fr 350px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.pad{padding:1.3rem}
.ed{font-size:1.05rem;line-height:1.8;min-height:20rem;resize:vertical}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem;align-items:center}
.b{background:var(--raise);border:1px solid var(--line);color:var(--text);border-radius:.6rem;padding:.5rem .9rem;cursor:pointer;font:inherit;font-size:.85rem}
.b:hover:not(:disabled){border-color:var(--gold)}.b:disabled{opacity:.4}
.b.go{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700}
#out{margin-top:1rem;padding:1rem 1.2rem;border-left:3px solid var(--gold);background:var(--bg);line-height:1.7;white-space:pre-wrap}
.gt{display:flex;flex-wrap:wrap;gap:.3rem;padding:.8rem .8rem 0}
.gt button{background:none;border:0;color:var(--muted);padding:.35rem .6rem;border-radius:.5rem;cursor:pointer;font:inherit;font-size:.82rem}
.gt button.on{background:var(--raise);color:var(--gold);font-weight:600}
#gbody{padding:1rem 1.2rem 1.3rem;font-size:.92rem;line-height:1.65}
#gbody li{margin:.5rem 0 0 1.1rem;list-style:disc}
.part{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:.5rem;padding:.55rem .8rem;margin-top:.5rem;background:var(--bg)}
.hidden{display:none!important}
</style>
<script src="paywall.js"></script>
</head>
<body class="ws">
<div class="wrap">
  <h1>Academic workspace</h1>
  <p class="sub" id="topic">Pick a chapter, learn what it needs, then write it with AI help.</p>

  <details class="box brief" id="briefBox" open>
    <summary>About your project (the AI uses this to help you)</summary>
    <div class="bgrid" id="bgrid"></div>
  </details>

  <nav class="tabs" id="tabs" aria-label="Chapters"></nav>

  <div class="cols">
    <section class="box pad">
      <h2 id="ct" style="font-size:1.2rem;font-weight:600"></h2>
      <textarea class="in ed" id="ed" placeholder="Write this chapter here, or ask the AI to help you start."></textarea>
      <div class="tools">
        <button class="b go" data-t="draft">Help me start</button>
        <button class="b" data-t="review">Check my writing</button>
        <button class="b" data-t="summarize">Short summary</button>
        <button class="b" data-t="readthrough">Read it back to me</button>
        <button class="b" data-t="explain">Explain simply</button>
        <span class="sub" id="wc" style="margin:0 0 0 auto"></span>
      </div>
      <div id="out" class="hidden" role="status"></div>
    </section>

    <aside class="box" aria-label="Chapter guide">
      <div class="gt" id="gt"></div>
      <div id="gbody"></div>
    </aside>
  </div>
</div>

<script src="projectpal.js"></script>
<script src="wsnav.js"></script>
<script>
(function () {
  var KEY = 'pp_ws2';
  var BRIEF = [['topic', 'Project topic'], ['region', 'Place (city or country)'], ['sample', 'Who or what you study'], ['problem', 'The main problem you are solving'], ['design', 'Type of research (interviews and words, numbers and surveys, or both)'], ['size', 'How many people, and how you will ask them (e.g. 100 people, questionnaire)']];
  var CH = [
    { t: 'Chapter 1: Introduction', goal: 'Convince the reader the problem is real, worth solving, and clearly bounded.', ana: 'Like a film trailer: it shows what the story is about and why it matters, without giving away the ending.', ex: 'A study on digital learning opens with falling exam scores after schools moved online, then states the exact question it will answer.', facts: ['Panels often read the introduction first and judge the whole project by it.', 'Describe the problem in one or two sentences, not a long paragraph.'], parts: ['Background', 'The problem', 'What you want to achieve', 'Questions you will answer', 'Why it matters', 'What your study covers'] },
    { t: 'Chapter 2: What others have written (Literature review)', goal: 'Show what is already known, and the gap your study fills.', ana: 'Like surveying a town before building a house: you check what exists so you do not build on someone else\'s plot.', ex: 'Three studies show internet cost blocks SME adoption, but none compare men and women. That missing comparison is your gap.', facts: ['Group sources by theme, not one author after another.', 'Use mostly recent sources (last 5 to 10 years) plus key older works.'], parts: ['Main theory behind your study', 'Meaning of key words', 'Past studies on your topic', 'What past studies missed (research gap)'] },
    { t: 'Chapter 3: How you did the research (Methodology)', goal: 'Explain how you collected and studied your answers so someone else could repeat it.', ana: 'Like a recipe: another cook should follow your steps and get the same dish.', ex: '100 shop owners in Lagos picked fairly from different areas, a 5-point questionnaire, and simple counts and percentages.', facts: ['Your type of research must match your questions.', 'Say how you keep people's answers private.'], parts: ['Type of research', 'Everyone you want to study', 'The smaller group you pick', 'Tool for collecting answers (e.g. questionnaire)', 'How you study the answers', 'Privacy and consent'] },
    { t: 'Chapter 4: Your results and what they mean', goal: 'Present what you found, then explain what it means.', ana: 'Like a doctor reading test results: first the numbers, then what they mean for the patient.', ex: 'A table shows 62% of respondents use e-learning weekly; the discussion links this to earlier findings on internet cost.', facts: ['Show what you found before explaining it.', 'Every table or chart needs a number, a title and a sentence explaining it.'], parts: ['Showing your data', 'Answers to each question', 'What the results mean', 'How results compare with past studies'] },
    { t: 'Chapter 5: Conclusion and suggestions', goal: 'Answer your questions, admit limits, and say what should happen next.', ana: 'Like the last scene of a film: it resolves the story and leaves the audience knowing what to do.', ex: 'The study concludes cost is the main barrier and recommends subsidised data bundles for student projects.', facts: ['Add no new data or sources here.', 'Suggestions must come straight from what you found.'], parts: ['Summary', 'Conclusion', 'What limited your study', 'Suggestions', 'What others can study next'] }
  ];
  var GT = [['goal', 'Goal'], ['ana', 'Analogy'], ['ex', 'Real example'], ['facts', 'Facts'], ['parts', 'What goes inside'], ['res', 'Find studies']];
  var S = { b: {}, ch: ['', '', '', '', ''], v: 0 }, g = 'goal';
  try { var r = JSON.parse(localStorage.getItem(KEY)); if (r && r.ch) S = r; } catch (e) {}
  var $ = function (i) { return document.getElementById(i); };
  var words = function (t) { return (t || '').trim().split(/\s+/).filter(Boolean).length; };
  var save = function () { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };

  var pr = ProjectPal.getProfile();
  if (!S.b.topic && pr.topic) S.b.topic = pr.topic;
  $('bgrid').innerHTML = BRIEF.map(function (f) { return '<div><label for="b_' + f[0] + '">' + f[1] + '</label><input class="in" id="b_' + f[0] + '"></div>'; }).join('');
  BRIEF.forEach(function (f) {
    var el = $('b_' + f[0]); el.value = S.b[f[0]] || '';
    el.addEventListener('input', function () { S.b[f[0]] = el.value; save(); head(); });
  });
  function head() { $('topic').textContent = S.b.topic ? 'Project: ' + S.b.topic : 'Pick a chapter, learn what it needs, then write it with AI help.'; }

  function tabs() {
    $('tabs').innerHTML = CH.map(function (c, i) { return '<button class="tab' + (i === S.v ? ' on' : '') + '" data-i="' + i + '">' + c.t.split(':')[0] + '<small>' + words(S.ch[i]) + 'w</small></button>'; }).join('');
    $('ct').textContent = CH[S.v].t; $('ed').value = S.ch[S.v] || ''; wc(); guide(); $('out').classList.add('hidden');
  }
  function wc() { $('wc').textContent = words($('ed').value) + ' words'; }
  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (!b) return; S.v = +b.dataset.i; save(); tabs(); });
  $('ed').addEventListener('input', function () { S.ch[S.v] = $('ed').value; save(); wc(); var s = document.querySelector('.tab.on small'); if (s) s.textContent = words($('ed').value) + 'w'; });

  function guide() {
    $('gt').innerHTML = GT.map(function (x) { return '<button data-g="' + x[0] + '" class="' + (g === x[0] ? 'on' : '') + '">' + x[1] + '</button>'; }).join('');
    var c = CH[S.v], h;
    if (g === 'facts') h = '<ul>' + c.facts.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>';
    else if (g === 'parts') h = '<p class="sub" style="margin-bottom:.3rem">Sections this chapter usually contains, in order:</p>' + c.parts.map(function (p) { return '<div class="part">' + esc(p) + '</div>'; }).join('');
    else if (g === 'res') h = '<p>Find studies and facts linked to your topic.</p><button class="b go" style="margin-top:.7rem" data-t="research">Find studies for this chapter</button><div id="resOut" style="margin-top:.8rem;white-space:pre-wrap"></div>';
    else h = '<p>' + esc(c[g]) + '</p>';
    $('gbody').innerHTML = h;
  }
  $('gt').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { g = b.dataset.g; guide(); } });

  function brief() { return BRIEF.filter(function (f) { return S.b[f[0]]; }).map(function (f) { return f[1] + ': ' + S.b[f[0]]; }).join('\n'); }
  function show(t, target) { var o = target || $('out'); o.textContent = t; o.classList.remove('hidden'); }
  async function ai(task, target) {
    var text = $('ed').value, btns = document.querySelectorAll('[data-t]');
    if (task === 'summarize' && words(text) < 20) return show('Write at least 20 words first, then ask for a short summary.', target);
    btns.forEach(function (b) { b.disabled = true; }); show('Working...', target);
    try {
      // Netlify function holds the Gemini key and checks credits (not built yet)
      var r = await fetch('/.netlify/functions/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ engine: 'project', task: task, chapter: CH[S.v].t, brief: brief(), text: text }) });
      if (!r.ok) throw 0; var j = await r.json(); if (!j.text) throw 0;
      show(j.text, target);
    } catch (e) {
      if (task === 'summarize') { // local fallback: first sentence of each paragraph
        var s = text.split(/\n+/).map(function (p) { return (p.match(/[^.!?]+[.!?]?/) || [''])[0].trim(); }).filter(Boolean).join(' ');
        show('Quick summary (AI not connected yet):\n' + s, target);
      } else show('AI is not connected yet. Your guide on the right still works, and you can keep writing.', target);
    }
    btns.forEach(function (b) { b.disabled = false; });
  }
  document.addEventListener('click', function (e) {
    var t = e.target.dataset && e.target.dataset.t; if (!t) return;
    ai(t, t === 'research' ? $('resOut') : null);
  });

  head(); tabs();
})();
</script>
</body>
</html>
