<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard - ProjectPal</title>
<script src="paywall.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="projectpal.css">
<style>
:root{--ink:#0F172A;--ocean:#1E3A8A;--mist:#F8FAFC;--line:#E2E8F0;--muted:#64748B;--ok:#15803D}
body{background:var(--mist);color:#334155;font-family:Inter,system-ui,sans-serif}
.wrap{max-width:1050px;margin:0 auto;padding:1.5rem 1.25rem 4rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-bottom:1.2rem;border-bottom:1px solid var(--line)}
.crumb{color:var(--muted)}.crumb b{color:var(--ink)}
.who{display:flex;align-items:center;gap:.7rem;text-align:right}
.av{width:2.6rem;height:2.6rem;border-radius:50%;background:#FEF3C7;color:#92400E;display:grid;place-items:center;font-weight:800}
.hero{margin-top:1.4rem;border-radius:1.2rem;padding:2rem;color:#fff;background:radial-gradient(circle at 85% 20%,rgba(45,212,191,.25),transparent 40%),linear-gradient(135deg,#0F172A,#111C33)}
.hero small{color:#5EEAD4;font-weight:700}
.hero h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;margin-top:.5rem;line-height:1.15}
.hero p{margin-top:.7rem;max-width:36rem;color:#CBD5E1;line-height:1.6}
.btn{display:inline-block;border-radius:.7rem;padding:.8rem 1.3rem;font-weight:700;text-decoration:none;margin:1.2rem .6rem 0 0}
.btn.w{background:#fff;color:var(--ink)}.btn.g{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}.btn.b{background:var(--ocean);color:#fff}
.cols{display:grid;gap:1.2rem;margin-top:1.6rem;grid-template-columns:1fr 320px}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:1rem;padding:1.4rem}
.card h2{font-size:1.15rem;font-weight:800;color:var(--ink)}
.tag{display:inline-block;background:#ECFDF5;color:var(--ocean);font-weight:700;font-size:.72rem;padding:.25rem .7rem;border-radius:99px}
.bar{height:.5rem;background:var(--line);border-radius:99px;overflow:hidden;margin-top:.8rem}.bar i{display:block;height:100%;background:var(--ocean)}
.ch{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 0;border-top:1px solid var(--line);font-size:.92rem}
.ch:first-of-type{border-top:0}.ok{color:var(--ok);font-weight:600}.mu{color:var(--muted)}
.next{background:#FFFBEB;border-color:#FDE68A}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="crumb">Dashboard / <b>Overview</b></p>
    <div class="who"><div><b id="uname" style="color:var(--ink)">Student</b><br><span id="urole" class="mu" style="font-size:.8rem">ProjectPal student</span></div><div class="av" id="uav">S</div></div>
  </header>

  <section class="hero">
    <small data-current-date></small>
    <h1 id="hh"></h1>
    <p id="hp"></p>
    <div id="hb"></div>
  </section>

  <div class="cols">
    <section class="card">
      <h2>Your project</h2>
      <div id="proj"></div>
    </section>
    <aside class="card next">
      <h2>Your next step</h2>
      <p id="nt" style="margin-top:.6rem;line-height:1.6"></p>
      <div id="nb"></div>
    </aside>
  </div>
</div>

<script src="projectpal.js"></script>
<script src="wsnav.js"></script>
<script>
(function () {
  var NAMES = ['Introduction', 'What others have written', 'How you did the research', 'Your results', 'Conclusion'];
  var S = { b: {}, ch: ['', '', '', '', ''] };
  try { var r = JSON.parse(localStorage.getItem('pp_ws2')); if (r && r.ch) S = r; } catch (e) {}
  var P = ProjectPal.getProfile(), $ = function (i) { return document.getElementById(i); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
  var words = function (t) { return (t || '').trim().split(/\s+/).filter(Boolean).length; };
  var first = (P.name || '').trim().split(/\s+/)[0] || 'there';
  var topic = (S.b.topic || '').trim();
  var wc = S.ch.map(words), done = wc.filter(function (n) { return n >= 30; }).length;
  var started = !!topic || wc.some(function (n) { return n > 0; });
  var nextI = wc.findIndex(function (n) { return n < 30; });
  var link = function (h, t, c) { return '<a class="btn ' + c + '" href="' + h + '">' + t + '</a>'; };

  $('uname').textContent = P.name || 'Student'; $('uav').textContent = first.charAt(0).toUpperCase();
  $('urole').textContent = P.school || P.level || 'ProjectPal student';

  if (!started) {
    $('hh').textContent = 'Welcome, ' + first + '. Let\u2019s start your project.';
    $('hp').textContent = 'Tell us your topic and we will guide you through it, one chapter at a time.';
    $('hb').innerHTML = link('workspace.html', 'Start your project', 'w') + link('workspace-video.html', 'Watch the tutorial', 'g');
    $('proj').innerHTML = '<p class="mu" style="margin-top:.6rem;line-height:1.6">You have no project yet. Open the Academic Workspace, type your topic, and your first chapter will be ready to write.</p>' + link('workspace.html', 'Start your project', 'b');
    $('nt').textContent = 'Write your project topic and the problem you want to solve. This takes about two minutes.';
    $('nb').innerHTML = link('workspace.html', 'Add my topic', 'b');
  } else if (done === 5) {
    $('hh').textContent = 'All five chapters are written, ' + first + '.';
    $('hp').textContent = 'Check your work, rewrite anything that looks too close to a source, and download it.';
    $('hb').innerHTML = link('final-lab.html', 'Open Final Chapter Lab', 'w');
    $('nt').textContent = 'Your chapters are ready. Check them and download your project.';
    $('nb').innerHTML = link('final-lab.html', 'Check and download', 'b');
  } else {
    $('hh').textContent = 'Your project is taking shape, ' + first + '.';
    $('hp').textContent = 'Keep your momentum. Each chapter you finish brings you closer to submission.';
    $('hb').innerHTML = link('workspace.html', 'Continue Chapter ' + (nextI + 1), 'w');
    $('nt').textContent = 'Next up: Chapter ' + (nextI + 1) + ', ' + NAMES[nextI] + '. Write at least 30 words to mark it done.';
    $('nb').innerHTML = link('workspace.html', 'Open Chapter ' + (nextI + 1), 'b');
  }
  if (started) {
    $('proj').innerHTML = '<span class="tag">Active project</span><h3 style="font-size:1.15rem;font-weight:800;color:var(--ink);margin-top:.7rem">' + esc(topic || 'Untitled project') + '</h3>' +
      (S.b.region ? '<p class="mu" style="font-size:.88rem">' + esc(S.b.region) + '</p>' : '') +
      '<div class="bar"><i style="width:' + (done / 5 * 100) + '%"></i></div><p class="mu" style="font-size:.82rem;margin:.4rem 0 .8rem">' + done + ' of 5 chapters done</p>' +
      NAMES.map(function (n, i) { return '<div class="ch"><span>Chapter ' + (i + 1) + ': ' + n + '</span><span class="' + (wc[i] >= 30 ? 'ok' : 'mu') + '">' + (wc[i] >= 30 ? 'Done' : wc[i] ? wc[i] + ' words' : 'Not started') + '</span></div>'; }).join('');
  }
})();
</script>
</body>
</html>
