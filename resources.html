<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Resources - ProjectPal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="projectpal.css">
<style>
:root{--bg:#F8FAFC;--panel:#fff;--raise:#EFF6FF;--line:#E2E8F0;--gold:#1E3A8A;--amber:#1E40AF;--text:#334155;--muted:#64748B;color:var(--text);font-family:Inter,system-ui,sans-serif}
.ws *:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:1.75rem 1.25rem 4rem}
.ws h1,.ws h2,.ws h3,.ws b{color:#0F172A}.ws h1{font-size:1.7rem;font-weight:700}.sub{color:var(--muted);margin-top:.3rem}
.box{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:1.3rem;margin-top:1.3rem}
.b{background:var(--gold);color:#fff;font-weight:700;border:0;border-radius:.65rem;padding:.7rem 1.2rem;cursor:pointer;font:inherit;font-weight:700}
.b:hover:not(:disabled){background:var(--amber)}.b:disabled{opacity:.4}
.in{width:100%;background:#fff;border:1px solid var(--line);border-radius:.6rem;color:var(--text);padding:.65rem .85rem;font:inherit}
.in:focus{border-color:var(--gold);outline:none}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:1.3rem}
.tab{background:none;border:1px solid var(--line);color:var(--muted);border-radius:.7rem;padding:.5rem 1rem;cursor:pointer;font:inherit;font-size:.88rem}
.tab.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.list{display:grid;gap:1rem;margin-top:1rem;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:.9rem;padding:1.1rem}
.card.ai{border-color:var(--gold)}
.tag{font-size:.75rem;color:var(--gold);font-weight:600}
.card h3{font-weight:600;margin-top:.4rem}.card p{color:var(--muted);font-size:.88rem;margin-top:.3rem}

</style>
</head>
<body class="ws">
<div class="wrap">
  <h1>Resources</h1>
  <p class="sub" id="topic">Materials, books and similar projects for your topic.</p>

  <section class="box">
    <h2 style="font-weight:600">Recommended for your project</h2>
    <p class="sub" id="why">Fill in your project brief in the Academic Workspace to get recommendations that fit your topic.</p>
    <button class="b" id="rec" style="margin-top:1rem">Get recommendations</button>
    <p class="sub" id="recMsg" role="status"></p>
    <div class="list" id="recList"></div>
  </section>

  <div class="tabs" id="tabs" role="tablist"></div>
  <input id="q" type="search" class="in" placeholder="Search the library" style="margin-top:1rem" aria-label="Search the library">
  <div class="list" id="list"></div>
  <p class="sub hidden" id="none">Nothing matches your search.</p>
</div>

<script src="projectpal.js"></script>
<script src="wsnav.js"></script>
<script>
(function () {
  var R = [
    { type: 'Materials', title: 'Research proposal template', note: 'A standard layout for scope, objectives and questions.' },
    { type: 'Materials', title: 'Referencing guide (APA 7)', note: 'How to cite books, journals and websites.' },
    { type: 'Materials', title: 'Questionnaire design checklist', note: 'Write clear, unbiased survey questions.' },
    { type: 'Books', title: 'Research methods textbook (sample entry)', note: 'Replace with the books your department recommends.' },
    { type: 'Books', title: 'Academic writing handbook (sample entry)', note: 'Replace with a real title and link.' },
    { type: 'Similar projects', title: 'Sample: Impact of digital learning on student performance', note: 'See how a complete five-chapter project is structured.' },
    { type: 'Similar projects', title: 'Sample: SME growth in Lagos', note: 'Mixed-methods example with a survey and interviews.' }
  ];
  var types = ['All', 'Materials', 'Books', 'Similar projects'], cur = 'All';
  var $ = function (i) { return document.getElementById(i); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
  var B = {};
  try { var s = JSON.parse(localStorage.getItem('pp_ws2')); if (s && s.b) B = s.b; } catch (e) {}
  var pr = ProjectPal.getProfile(); if (!B.topic && pr.topic) B.topic = pr.topic;
  if (B.topic) { $('topic').textContent = 'Project: ' + B.topic; $('why').textContent = 'The AI will pick materials, books and similar projects that fit "' + B.topic + '".'; }

  function card(r, ai) { return '<article class="card' + (ai ? ' ai' : '') + '"><span class="tag">' + esc(r.type) + (ai ? ' · picked for you' : '') + '</span><h3>' + esc(r.title) + '</h3><p>' + esc(r.note) + '</p></article>'; }
  function draw() {
    var q = $('q').value.toLowerCase();
    var rows = R.filter(function (r) { return (cur === 'All' || r.type === cur) && (r.title + r.note).toLowerCase().indexOf(q) > -1; });
    $('list').innerHTML = rows.map(function (r) { return card(r); }).join('');
    $('none').classList.toggle('hidden', rows.length > 0);
    $('tabs').innerHTML = types.map(function (t) { return '<button class="tab' + (t === cur ? ' on' : '') + '" data-t="' + t + '">' + t + '</button>'; }).join('');
  }
  $('tabs').addEventListener('click', function (e) { var t = e.target.dataset.t; if (t) { cur = t; draw(); } });
  $('q').addEventListener('input', draw);

  $('rec').addEventListener('click', async function () {
    if (!B.topic) { $('recMsg').textContent = 'Add your project topic in the Academic Workspace brief first.'; return; }
    var btn = $('rec'); btn.disabled = true; $('recMsg').textContent = 'Finding resources...';
    try {
      // Netlify function holds the Gemini key and checks credits (not built yet).
      // Expected reply: { items: [{ type, title, note }] }
      var r = await fetch('/.netlify/functions/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ engine: 'quikaz', task: 'recommend', brief: B }) });
      if (!r.ok) throw 0; var j = await r.json();
      if (!j.items || !j.items.length) throw 0;
      $('recList').innerHTML = j.items.map(function (x) { return card(x, true); }).join('');
      $('recMsg').textContent = 'Check each source exists before you cite it.';
    } catch (e) { $('recMsg').textContent = 'AI recommendations are not connected yet. The library below still works.'; }
    btn.disabled = false;
  });
  draw();
})();
</script>
</body>
</html>
