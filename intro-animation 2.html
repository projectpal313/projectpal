<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ProjectPal — Intro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at top,#14314d 0%, #102A43 35%, #0b1629 100%);
  color:#fff;position:relative;transition:opacity .5s ease;
}
body.transitioning{opacity:0}
.scene{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45;pointer-events:none}
.orb1{width:420px;height:420px;background:#0F766E;top:-120px;left:-80px;animation:orb 11s ease-in-out infinite}
.orb2{width:360px;height:360px;background:#F59E0B;bottom:-120px;right:-60px;animation:orb 12s ease-in-out infinite reverse}
.orb3{width:300px;height:300px;background:#2DD4BF;top:50%;left:68%;transform:translate(-50%,-50%);animation:orb 10s ease-in-out infinite}
@keyframes orb{0%,100%{transform:translate(0,0)scale(1)}50%{transform:translate(30px,-30px)scale(1.08)}}
.container{position:relative;z-index:2;text-align:center}
.logo{width:128px;height:128px;margin:0 auto 2rem;filter:drop-shadow(0 20px 35px rgba(15,118,110,.32));animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.brand{display:flex;justify-content:center;align-items:flex-end;gap:.12em;flex-wrap:wrap;font-size:clamp(2.8rem,8vw,6.5rem);font-weight:900;letter-spacing:-.08em;line-height:.88;min-height:1.2em}
.letter{display:inline-block;opacity:0;transform:translateY(42px) scale(.7) rotateX(80deg);animation:letterDrop .7s cubic-bezier(.14,.9,.2,1) forwards}
@keyframes letterDrop{0%{opacity:0;transform:translateY(42px)scale(.7)rotateX(80deg)}60%{opacity:1;transform:translateY(-8px)scale(1.05)rotateX(0deg)}100%{opacity:1;transform:translateY(0)scale(1)rotateX(0deg)}}
.tagline{margin-top:1.1rem;font-size:clamp(1.05rem,2.2vw,1.5rem);color:#cbd5e1;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:0;animation:fadeUp 1s ease-out 1.5s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.features{display:flex;justify-content:center;gap:1.4rem;flex-wrap:wrap;margin-top:2.5rem;opacity:0;animation:fadeUp 1s ease-out 2.1s forwards}
.feat{min-width:130px;padding:1rem .9rem;border:1px solid rgba(148,163,184,.25);border-radius:18px;background:rgba(15,23,42,.2);backdrop-filter:blur(4px)}
.feat span{display:block;font-size:1.7rem;margin-bottom:.6rem}
.feat p{font-size:.82rem;font-weight:700;color:#dbeafe;letter-spacing:.04em;text-transform:uppercase}
.progress{position:absolute;bottom:0;left:0;width:100%;height:4px;background:rgba(255,255,255,.08)}
.bar{height:100%;width:0;background:linear-gradient(90deg,#0F766E,#2DD4BF,#F59E0B);animation:fillBar 3.7s ease-out forwards}
@keyframes fillBar{to{width:100%}}
.btn{margin-top:1.6rem;padding:14px 26px;border-radius:999px;border:1px solid rgba(45,212,191,.45);background:linear-gradient(90deg,#0F766E,#0D9488);box-shadow:0 16px 28px rgba(15,118,110,.28);color:white;font-weight:800;letter-spacing:.03em;cursor:pointer;opacity:0;animation:showBtn .6s ease-out 3.3s forwards;transition:transform .2s ease, box-shadow .2s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 18px 35px rgba(15,118,110,.38)}
@keyframes showBtn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media (max-width: 640px){
  .features{gap:.8rem}
  .feat{min-width:110px;padding:.8rem .6rem}
}
</style>
</head>
<body>
<div class="scene">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="container">
    <div class="logo" aria-label="ProjectPal logo">
      <svg viewBox="0 0 120 120" width="128" height="128" role="img" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F766E"/>
            <stop offset="100%" stop-color="#2DD4BF"/>
          </linearGradient>
        </defs>
        <g>
          <polygon points="60,20 110,40 60,60 10,40" fill="url(#g)"/>
          <rect x="55" y="55" width="10" height="35" rx="3" fill="#2DD4BF"/>
          <rect x="45" y="85" width="30" height="12" rx="4" fill="#0F766E"/>
          <line x1="110" y1="40" x2="110" y2="55" stroke="#2DD4BF" stroke-width="3"/>
          <circle cx="110" cy="58" r="4" fill="#F59E0B"/>
        </g>
      </svg>
    </div>

    <h1 class="brand" id="brand" aria-label="ProjectPal"></h1>
    <p class="tagline">Your project. Your pace.</p>

    <div class="features">
      <div class="feat"><span>📚</span><p>Guided Chapters</p></div>
      <div class="feat"><span>🎯</span><p>Track Progress</p></div>
      <div class="feat"><span>✦</span><p>Expert Help</p></div>
    </div>

    <button class="btn" onclick="location='login.html'">Enter ProjectPal →</button>
  </div>

  <div class="progress"><div class="bar"></div></div>
</div>

<script>
  const seenIntro = sessionStorage.getItem('introShown');
  if (seenIntro === '1') {
    window.location.replace('/login.html');
  } else {
    sessionStorage.setItem('introShown', '1');
  }

  const brand = document.getElementById('brand');
  const brandText = 'PROJECTPAL';

  brandText.split('').forEach((char, index) => {
    const span = document.createElement('span');
    span.className = 'letter';
    span.textContent = char;
    span.style.animationDelay = (0.35 + index * 0.08) + 's';
    brand.appendChild(span);
  });

  setTimeout(() => {
    document.body.classList.add('transitioning');
  }, 3000);

  setTimeout(() => {
    window.location.replace('/login.html');
  }, 4200);
</script>
</body>
</html>
